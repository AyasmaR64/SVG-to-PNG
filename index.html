<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#001c3d" />
    <title>SVG to PNG Converter</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />

    <!-- Modern Styles -->
    <style>
      :root {
        --primary: #b9b9b9;
        --primary-hover: #005896;
        --bg: #001c3d;
        --card-bg: #002654;
        --text: #d1d1d1;
        --text-light: #ffffff;
        --border: #b9f602c5;
        --radius: 12px;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
      }

      body {
        background-color: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
      }

      .container {
        background: var(--card-bg);
        width: 100%;
        max-width: 480px;
        padding: 2rem;
        border-radius: var(--radius);
        box-shadow:
          0 4px 6px -1px rgb(0 0 0 / 0.1),
          0 2px 4px -2px rgb(0 0 0 / 0.1);
        text-align: center;
      }

      h1 {
        font-size: 1.5rem;
        font-weight: 700;
        margin-bottom: 0.5rem;
      }

      p.subtitle {
        color: var(--text-light);
        font-size: 0.9rem;
        margin-bottom: 1.5rem;
      }

      .file-drop-zone {
        border: 2px dashed var(--border);
        border-radius: var(--radius);
        padding: 2rem 1.5rem;
        cursor: pointer;
        transition: all 0.2s ease;
        background: #000000;
        position: relative;
      }

      .file-drop-zone:hover {
        border-color: var(--primary);
        background: #1c1c1c;
      }

      .file-drop-zone input[type="file"] {
        position: absolute;
        inset: 0;
        opacity: 0;
        cursor: pointer;
        width: 100%;
        height: 100%;
      }

      .file-label {
        font-weight: 500;
        color: var(--primary);
        pointer-events: none;
      }

      #out {
        margin-top: 1.5rem;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      #out a {
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #000000;
        color: white;
        text-decoration: none;
        padding: 0.75rem 1rem;
        border-radius: 8px;
        font-weight: 500;
        font-size: 0.95rem;
        transition: background-color 0.2s ease;
        box-shadow: 0 2px 4px rgba(79, 70, 229, 0.2);
      }

      #out a:hover {
        background-color: var(--primary-hover);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>SVG to PNG Converter</h1>
      <p class="subtitle">
        Convert vector files instantly offline in multiple sizes
      </p>

      <div class="file-drop-zone">
        <span class="file-label">Choose an SVG file or drop it here</span>
        <input type="file" id="f" accept=".svg" />
      </div>

      <div id="out"></div>
    </div>

    <script>
      document.getElementById("f").onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const url = URL.createObjectURL(file);
        const img = new Image();

        img.onload = () => {
          const outContainer = document.getElementById("out");
          outContainer.innerHTML = ""; // Clear previous results

          [180, 192, 512].forEach((size) => {
            const c = document.createElement("canvas");
            c.width = c.height = size;
            c.getContext("2d").drawImage(img, 0, 0, size, size);

            const a = document.createElement("a");
            a.download = `${file.name.replace(/\.svg$/i, "")}-${size}.png`;
            a.href = c.toDataURL("image/png");
            a.textContent = `Download ${size}x${size} PNG`;
            outContainer.appendChild(a);
          });

          URL.revokeObjectURL(url);
        };
        img.src = url;
      };

      // Register Service Worker for PWA capabilities
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js").catch((err) => {
            console.log("Service Worker registration failed: ", err);
          });
        });
      }
    </script>
  </body>
</html>
